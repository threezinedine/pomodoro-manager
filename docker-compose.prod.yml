services:
  mysql:
    image: mysql:8.0
    container_name: pomodoro-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pomodoro}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pomodoro-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${SERVER_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_TOKEN: ${AUTH_TOKEN}
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pomodoro-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pomodoro-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
      - client

volumes:
  mysql_data:
