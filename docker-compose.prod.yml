services:
  mysql:
    image: mysql:8.0
    container_name: pomodoro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: pomodoro
      MYSQL_USER: pomodoro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pomodoro123}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pomodoro-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://pomodoro:${MYSQL_PASSWORD:-pomodoro123}@mysql:3306/pomodoro
      AUTH_TOKEN: ${AUTH_TOKEN:-changeme}
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pomodoro-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pomodoro-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
      - client

volumes:
  mysql_data:
